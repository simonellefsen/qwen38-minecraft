<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voxelcraft — a Minecraft-style sandbox</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%234faf3f'/><rect y='10' width='16' height='6' fill='%238a5a34'/></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"><i></i><i></i></div>
    <div id="hotbar"></div>
    <div id="hud"></div>
    <div id="overlay" class="overlay visible">
      <div class="panel">
        <h1>Voxelcraft</h1>
        <p class="tag">A blocky little world, right in your browser.</p>
        <button id="play">Play</button>
        <button id="reset" class="ghost">Reset world</button>
        <div class="keys">
          <div><span>W A S D</span> move</div>
          <div><span>Mouse</span> look</div>
          <div><span>Space</span> jump / swim</div>
          <div><span>Shift</span> sprint</div>
          <div><span>Left click</span> break block</div>
          <div><span>Right click</span> place block</div>
          <div><span>Middle click</span> pick block</div>
          <div><span>1–10 / 0 / wheel</span> select block</div>
          <div><span>Esc</span> pause</div>
        </div>
        <p class="fine">Your block edits are saved in this browser. Terrain seed: 1337.</p>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
